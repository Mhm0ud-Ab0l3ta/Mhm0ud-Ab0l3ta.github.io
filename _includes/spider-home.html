<script>
  (() => {
    const hero = document.querySelector('.spider-hero');
    const terminal = document.getElementById('operator-console');
    const input = document.getElementById('console-command');
    const output = document.getElementById('console-output');
    const statusLine = document.querySelector('[data-terminal-text]');

    if (!hero || !terminal) return;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!reduceMotion) {
      hero.addEventListener('pointermove', (event) => {
        const bounds = hero.getBoundingClientRect();
        const x = ((event.clientX - bounds.left) / bounds.width - 0.5).toFixed(3);
        const y = ((event.clientY - bounds.top) / bounds.height - 0.5).toFixed(3);
        hero.style.setProperty('--pointer-x', x);
        hero.style.setProperty('--pointer-y', y);
      });

      if (statusLine) {
        const text = statusLine.dataset.terminalText;
        statusLine.textContent = '';
        let index = 0;
        const typeNext = () => {
          statusLine.textContent = text.slice(0, index++);
          if (index <= text.length) window.setTimeout(typeNext, 28);
        };
        window.setTimeout(typeNext, 450);
      }
    }

    const commands = {
      help: 'Available: whoami · ls · pwd · medium · github · clear',
      whoami: 'Ab0L3TA — DFIR analyst, CTF player, and challenge author.',
      ls: 'writeups/  challenge-authoring/  about/  evidence.log',
      pwd: '/home/Ab0L3TA/casefiles',
      medium: 'Opening the canonical Medium archive…',
      github: 'Opening the source repository…'
    };

    input?.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      const command = input.value.trim().toLowerCase();
      if (!command) return;

      if (command === 'clear') {
        output.replaceChildren();
        input.value = '';
        return;
      }

      const line = document.createElement('p');
      line.className = 'command-response';
      line.textContent = `$ ${command}\n${commands[command] || `command not found: ${command}. Try help.`}`;
      output.append(line);
      input.value = '';
      terminal.scrollTop = terminal.scrollHeight;

      if (command === 'medium') {
        window.setTimeout(() => window.open('https://medium.com/@MAb0EL3TA', '_blank', 'noopener'), 250);
      } else if (command === 'github') {
        window.setTimeout(() => window.open('https://github.com/Mhm0ud-Ab0l3ta', '_blank', 'noopener'), 250);
      }
    });
  })();
</script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toc = document.getElementById('toc');
    const content = document.querySelector('main article > .content');
    let selectedHeading;
    let settleTimer;

    if (!toc || !content) {
      return;
    }

    const alignHeading = () => {
      if (!selectedHeading) {
        return;
      }

      const top = window.scrollY + selectedHeading.getBoundingClientRect().top - 32;
      window.scrollTo({ top, behavior: 'auto' });
    };

    const keepHeadingAligned = (heading) => {
      selectedHeading = heading;
      requestAnimationFrame(alignHeading);
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => {
        selectedHeading = undefined;
      }, 5000);
    };

    toc.addEventListener('click', (event) => {
      const link = event.target.closest('a[href^="#"]');

      if (!link) {
        return;
      }

      const heading = document.getElementById(decodeURIComponent(link.hash.slice(1)));

      if (!heading) {
        return;
      }

      keepHeadingAligned(heading);
    });

    content.addEventListener('load', (event) => {
      if (selectedHeading && event.target instanceof HTMLImageElement) {
        requestAnimationFrame(alignHeading);
      }
    }, true);
  });
</script>
